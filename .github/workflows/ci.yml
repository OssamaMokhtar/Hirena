name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OS3 / Hirena — Prototype career assessment platform.
# This workflow validates the repository structure and will evolve into a
# full npm/TypeScript pipeline when the project is production-hardened.

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          echo "Checking required files..."
          test -f README.md && echo "✓ README.md"
          test -f LICENSE && echo "✓ LICENSE"
          test -f SECURITY.md && echo "✓ SECURITY.md"
          test -f PRIVACY.md && echo "✓ PRIVACY.md"
          echo ""
          echo "Checking source files..."
          test -f index.tsx && echo "✓ index.tsx"
          test -f App.tsx && echo "✓ App.tsx"
          test -f package.json && echo "✓ package.json"
          echo ""
          echo "Repository structure validated."

      - name: Check for sensitive data
        run: |
          echo "Scanning for potential secrets..."
          if grep -r "AIza" . --include="*.tsx" --include="*.ts" --include="*.md" 2>/dev/null; then
            echo "⚠ WARNING: Potential Google API key found — review immediately"
            exit 1
          fi
          echo "✓ No obvious secrets detected."

      - name: Document roadmap
        run: |
          echo ""
          echo "=== CI Roadmap ==="
          echo "Current: Repository structure validation + secret scanning"
          echo "Next: Add npm pipeline (npm ci, lint, build, test)"
          echo "Future: npm audit, TypeScript compilation check"
          echo ""
          echo "Tailwind CSS: Currently loaded from CDN (known production issue)."
          echo "Migration to PostCSS plugin is on the roadmap."
          echo ""
          echo "See improvement plan: Obsidian/Portfolio-Due-Diligence/06-Improvement-Plan-Hirena.md"
