name: CI

# Every step is a real gate. The previous workflow ran lint with `|| echo` and
# the audit with `|| true`, so neither could ever fail a build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Docs (links resolve, Mermaid closed, status lines)
        run: bash scripts/check-docs.sh

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests (scoring determinism, removed endpoints, no emotion inference, fallback labelling)
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high
